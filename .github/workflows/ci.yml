name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check publication contents
        run: python3 scripts/check-release.py --public
      - name: Build and packaging tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Configure
        run: cmake -S . -B build/host -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/host --parallel 4
      - name: Test (assertions enabled)
        run: ctest --test-dir build/host --output-on-failure --parallel 4
  shaders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install shader compiler
        run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - name: Compile Vulkan and validate GLES shaders
        run: python3 scripts/compile-shaders.py
